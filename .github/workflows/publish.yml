name: publish

# 发布到 npm —— 走 Trusted Publishing（OIDC），仓库里不留任何长期 token。
#
# 用法：
#   1) 改 package.json 的 version（例如 0.1.0）
#   2) 打同名 annotated tag 推上去：git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#   3) 本 workflow：校验 tag ↔ version → 装依赖 → 构建 → 跑测试 → 发布（带 provenance）→ 建 Release
#
# 前置条件（npm 网页上配一次）：
#   npmjs.com → 包设置 → Trusted Publisher → GitHub Actions
#     Organization or user : yfwu2020
#     Repository           : dsh-think-flow
#     Workflow filename    : publish.yml
#     Allowed actions      : 勾选 npm publish（默认只允许 stage publish）
#
# ⚠️ workflow 文件名必须与 npm 上登记的一致（本文件 = publish.yml）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 也允许手动触发（演练 / 重发）

permissions:
  contents: write # ← 建 GitHub Release 需要
  id-token: write # ← OIDC 换取 npm 短期凭据所必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 抓全量历史；fetch-tags: true 让 tag 连同**注解对象**一起下来。
      #
      # ⚠️ 但这两条**都不足以**让后面读到注解：checkout 之后还会再来一抓把触发本次 run
      #    的 tag 对齐到那个 commit（`fetch --no-tags ... +<sha>:refs/tags/<tag>`），
      #    那一抓会把本地 tag 变成轻量 ref。所以 Release 说明改从 API 读（见最后一步）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Node ≥ 22.14、npm ≥ 11.5.1 才能用 trusted publishing
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: 升级 npm 到支持 OIDC 的版本
        run: npm install -g npm@^11.5.1

      - name: 校验 tag 与 package.json version 一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json version $PKG 不一致"
            exit 1
          fi

      # devDependencies 里钉了 @deepseek-ai/*（构建要它们的类型、测试要主题包）。
      # 装完 node_modules/@deepseek-ai 是真实目录，build.sh 走"用本包 node_modules"那条路。
      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建（tsc 编译 host + 拷贝 client bundle）
        run: bash scripts/build.sh

      - name: 测试（trace / titles / routes / client，全部离线）
        run: npm test

      # 幂等：这个版本已经发过就跳过发布（tag 重推 / 手动重跑时不至于红一片）
      - name: 这个版本在 npm 上是不是已经有了
        if: startsWith(github.ref, 'refs/tags/')
        id: check
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "@yfwu2020/dsh-think-flow@$V" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$V 已在 npm 上，跳过发布"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # 关键：不传 NODE_AUTH_TOKEN，让 npm CLI 自动检测 OIDC 环境。
      - name: 发布到 npm（Trusted Publishing + provenance）
        if: startsWith(github.ref, 'refs/tags/') && steps.check.outputs.already == 'false'
        run: npm publish --access public --provenance

      # 打 npm 包（与刚发布的同一份产物），作为 Release 附件
      - name: 打包（Release 附件）
        if: startsWith(github.ref, 'refs/tags/')
        id: pack
        run: echo "tgz=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      # 建 Release：tag 已存在 → --verify-tag；重复运行 → --clobber 覆盖附件。
      # 说明取自 tag 的 %(contents)：annotated tag 用你写的注解，轻量 tag 回落到 commit message。
      # ⚠️ 别读本地那份注解 —— 读不到。checkout 抓完 tag 之后还会**再来一抓**
      #    （CI 日志里那条 `fetch --no-tags --prune ... +<sha>:refs/tags/<tag>`，
      #    目的是把 tag 对齐到触发本次 run 的那个 commit），代价是本地这个 ref 变成
      #    **轻量**的、注解对象被覆盖掉，于是 `git tag -l --format='%(contents)'`
      #    给出的是 **commit message**。它看起来"像那么回事"，所以这个坑不报错，
      #    只让 Release 说明悄悄变错（v0.1.0、v0.1.1 都踩过；fetch-depth/fetch-tags
      #    都救不了，因为问题出在那一抓，不在这一步）。
      #    直接从 API 读 tag 对象，就与本地 ref 长什么样无关。
      # 说明来源：annotated tag 用你写的注解；轻量 tag 没有注解 → --generate-notes。
      - name: 建 GitHub Release 并附 tgz
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TGZ="${{ steps.pack.outputs.tgz }}"
          NOTES_FILE="$(mktemp)"

          # 读 API 的小工具：**带重试**。一次失败就回落成 --generate-notes 的话，
          # 说明会悄悄变成 "Full Changelog" —— 和"读本地注解"是同一类错误：
          # 不报错，只是内容不对。
          api_read() {
            local out=""
            for _ in 1 2 3; do
              out="$(gh api "$1" --jq "$2" 2>/dev/null || true)"
              if [ -n "$out" ]; then printf '%s' "$out"; return 0; fi
              sleep 2
            done
            return 1
          }

          OBJ_TYPE="$(api_read "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" '.object.type' || true)"
          if [ "$OBJ_TYPE" = "tag" ]; then
            OBJ_SHA="$(api_read "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" '.object.sha' || true)"
            if [ -n "$OBJ_SHA" ]; then
              api_read "repos/$GITHUB_REPOSITORY/git/tags/$OBJ_SHA" '.message' > "$NOTES_FILE" || true
            fi
          fi

          if [ -s "$NOTES_FILE" ]; then
            NOTES_ARG=(--notes-file "$NOTES_FILE")
            echo "Release 说明：取自 tag 注解（$(wc -c < "$NOTES_FILE" | tr -d ' ') 字节）"
          else
            NOTES_ARG=(--generate-notes)
            echo "⚠️ 读不到 tag 注解（轻量 tag，或 API 连续三次失败）→ 回落 --generate-notes"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 只覆盖附件"
            gh release upload "$TAG" "$TGZ" --clobber
          else
            gh release create "$TAG" "$TGZ" --verify-tag --title "$TAG" "${NOTES_ARG[@]}"
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)"
